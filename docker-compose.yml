services:
  postgres:
    image: postgres:16.4-alpine
    container_name: westcoast-fitness-db
    environment:
      POSTGRES_DB: westcoast_fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev-only}
    ports:
      - "5432:5432"
    volumes:
      - fitness_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d westcoast_fitness"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitness_pg:
